<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3D Road Racer</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #000;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    font-family: 'Segoe UI', sans-serif;
    overflow: hidden;
  }
  #gameContainer {
    position: relative;
    width: 100vw;
    height: 100vh;
  }
  canvas { display: block; width: 100%; height: 100%; }
  #hud {
    position: absolute;
    top: 15px; left: 20px; right: 20px;
    display: flex;
    justify-content: space-between;
    color: #fff;
    font-size: 20px;
    font-weight: bold;
    text-shadow: 2px 2px 6px rgba(0,0,0,0.9);
    pointer-events: none;
    z-index: 10;
  }
  #overlay {
    position: absolute;
    inset: 0;
    background: rgba(0,0,0,0.8);
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    color: #fff;
    z-index: 20;
  }
  #overlay.hidden { display: none; }
  #overlay h1 { font-size: 52px; color: #e94560; margin-bottom: 10px; }
  #overlay h2 { font-size: 28px; margin-bottom: 5px; }
  #overlay p { font-size: 18px; color: #ccc; margin-bottom: 20px; }
  #overlay .score-display {
    font-size: 36px; color: #fff; background: #e94560;
    padding: 10px 30px; border-radius: 8px; margin-bottom: 20px;
  }
  #startBtn {
    padding: 14px 40px; font-size: 20px; background: #e94560; color: #fff;
    border: none; border-radius: 8px; cursor: pointer; transition: background 0.2s;
    touch-action: manipulation;
  }
  #startBtn:hover { background: #c73652; }
  .controls-hint { font-size: 14px; color: #888; margin-top: 15px; }

  /* ── Mobile Controls ── */
  #mobileControls {
    position: absolute;
    bottom: 30px;
    left: 0;
    right: 0;
    display: flex;
    justify-content: space-between;
    padding: 0 20px;
    z-index: 15;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.3s;
  }
  #mobileControls.visible {
    opacity: 1;
    pointer-events: all;
  }
  .mobile-btn {
    width: 80px;
    height: 80px;
    background: rgba(255,255,255,0.15);
    border: 2px solid rgba(255,255,255,0.35);
    border-radius: 50%;
    color: #fff;
    font-size: 32px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    user-select: none;
    -webkit-user-select: none;
    touch-action: manipulation;
    transition: background 0.1s;
  }
  .mobile-btn:active { background: rgba(255,255,255,0.35); }
  /* Hide on desktop (mouse pointer) */
  @media (hover: hover) and (pointer: fine) {
    #mobileControls { display: none !important; }
  }
  /* Smaller HUD on compact screens */
  @media (max-width: 480px) {
    #hud { font-size: 14px; top: 8px; left: 10px; right: 10px; }
    #overlay h1 { font-size: 36px; }
    #overlay h2 { font-size: 22px; }
    #overlay p { font-size: 15px; }
    .mobile-btn { width: 70px; height: 70px; font-size: 26px; }
  }
</style>
</head>
<body>

<div id="gameContainer">
  <div id="hud">
    <span id="scoreDisplay">Score: 0</span>
    <span id="speedDisplay">Speed: 0 km/h</span>
    <span id="highScoreDisplay">Best: 0</span>
  </div>
  <div id="overlay">
    <h1>Road Racer 3D</h1>
    <h2 id="overlayTitle">Ready to race?</h2>
    <p id="overlayMsg">Dodge traffic and survive as long as you can!</p>
    <div class="score-display hidden" id="finalScore"></div>
    <button id="startBtn">Start Race</button>
    <div class="controls-hint">Left / Right arrows or A / D to steer</div>
  </div>
  <div id="mobileControls">
    <button class="mobile-btn" id="leftBtn" aria-label="Steer left">&#9664;</button>
    <button class="mobile-btn" id="rightBtn" aria-label="Steer right">&#9654;</button>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
  }
}
</script>

<script type="module">
import * as THREE from 'three';

// ── DOM ──
const container = document.getElementById('gameContainer');
const overlayEl = document.getElementById('overlay');
const startBtn = document.getElementById('startBtn');
const scoreEl = document.getElementById('scoreDisplay');
const speedEl = document.getElementById('speedDisplay');
const highScoreEl = document.getElementById('highScoreDisplay');
const overlayTitle = document.getElementById('overlayTitle');
const overlayMsg = document.getElementById('overlayMsg');
const finalScoreEl = document.getElementById('finalScore');

// ── Constants ──
const ROAD_WIDTH = 12;
const LANE_COUNT = 4;
const LANE_WIDTH = ROAD_WIDTH / LANE_COUNT;
const ROAD_LENGTH = 600;
const SEGMENT_LENGTH = 12;
const NUM_SEGMENTS = Math.ceil(ROAD_LENGTH / SEGMENT_LENGTH);
const TREE_SPACING = 8;
const NUM_TREES_PER_SIDE = Math.ceil(ROAD_LENGTH / TREE_SPACING);
const ENEMY_COLORS = [0xe94560, 0xff6b35, 0xffd166, 0x06d6a0, 0x118ab2, 0x8338ec];

// ── State ──
let gameState = 'menu';
let score = 0;
let scoreFrac = 0;
let highScore = parseInt(localStorage.getItem('racingHighScore') || '0');
let speed = 0;
let maxSpeed = 120;
let frameCount = 0;
let playerX = 0;
let playerVx = 0;
let worldZ = 0;
let keys = {};
let enemies = [];
let crashParticles = [];
let clock;

highScoreEl.textContent = `Best: ${highScore}`;

// ── Audio (Web Audio API — no files needed) ──
let audioCtx = null;
let engineOsc = null;
let engineGain = null;
let engineRunning = false;

function initAudio() {
  if (audioCtx) return;
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
}

function startEngine() {
  if (!audioCtx) initAudio();
  if (engineRunning) return;

  engineOsc = audioCtx.createOscillator();
  engineGain = audioCtx.createGain();
  const filter = audioCtx.createBiquadFilter();

  engineOsc.type = 'sawtooth';
  engineOsc.frequency.value = 60;
  engineGain.gain.value = 0.06;

  filter.type = 'lowpass';
  filter.frequency.value = 300;
  filter.Q.value = 5;

  engineOsc.connect(filter);
  filter.connect(engineGain);
  engineGain.connect(audioCtx.destination);
  engineOsc.start();
  engineRunning = true;
}

function updateEngineSound(currentSpeed, maxSpd) {
  if (!engineOsc) return;
  const ratio = Math.min(currentSpeed / maxSpd, 1);
  engineOsc.frequency.value = 55 + ratio * 180;
  engineGain.gain.value = 0.04 + ratio * 0.07;
}

function stopEngine() {
  if (!engineRunning) return;
  try {
    engineGain.gain.setTargetAtTime(0, audioCtx.currentTime, 0.1);
    engineOsc.stop(audioCtx.currentTime + 0.3);
  } catch (e) {}
  engineRunning = false;
  engineOsc = null;
  engineGain = null;
}

function playCrash() {
  if (!audioCtx) return;
  // Noise burst
  const bufferSize = audioCtx.sampleRate * 0.4;
  const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
  const data = buffer.getChannelData(0);
  for (let i = 0; i < bufferSize; i++) {
    data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / bufferSize, 2);
  }
  const noise = audioCtx.createBufferSource();
  noise.buffer = buffer;

  const gain = audioCtx.createGain();
  gain.gain.value = 0.35;
  gain.gain.setTargetAtTime(0, audioCtx.currentTime + 0.05, 0.12);

  const filter = audioCtx.createBiquadFilter();
  filter.type = 'lowpass';
  filter.frequency.value = 1200;

  noise.connect(filter);
  filter.connect(gain);
  gain.connect(audioCtx.destination);
  noise.start();

  // Low thud
  const thud = audioCtx.createOscillator();
  const thudGain = audioCtx.createGain();
  thud.type = 'sine';
  thud.frequency.value = 80;
  thud.frequency.setTargetAtTime(30, audioCtx.currentTime, 0.15);
  thudGain.gain.value = 0.4;
  thudGain.gain.setTargetAtTime(0, audioCtx.currentTime + 0.05, 0.15);
  thud.connect(thudGain);
  thudGain.connect(audioCtx.destination);
  thud.start();
  thud.stop(audioCtx.currentTime + 0.5);
}

function playWhoosh() {
  if (!audioCtx) return;
  const bufferSize = audioCtx.sampleRate * 0.15;
  const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
  const data = buffer.getChannelData(0);
  for (let i = 0; i < bufferSize; i++) {
    const env = Math.sin(Math.PI * i / bufferSize);
    data[i] = (Math.random() * 2 - 1) * env * 0.3;
  }
  const noise = audioCtx.createBufferSource();
  noise.buffer = buffer;

  const filter = audioCtx.createBiquadFilter();
  filter.type = 'bandpass';
  filter.frequency.value = 800 + Math.random() * 400;
  filter.Q.value = 2;

  const gain = audioCtx.createGain();
  gain.gain.value = 0.12;

  const panner = audioCtx.createStereoPanner();
  panner.pan.value = (Math.random() - 0.5) * 1.5;

  noise.connect(filter);
  filter.connect(gain);
  gain.connect(panner);
  panner.connect(audioCtx.destination);
  noise.start();
}

// ── Three.js Setup ──
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(window.devicePixelRatio);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
container.insertBefore(renderer.domElement, container.firstChild);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87ceeb);
scene.fog = new THREE.Fog(0x87ceeb, 150, 350);

const camera = new THREE.PerspectiveCamera(65, window.innerWidth / window.innerHeight, 0.1, 500);
camera.position.set(0, 5, 10);
camera.lookAt(0, 1, -20);

// ── Lighting ──
const ambientLight = new THREE.AmbientLight(0x6688cc, 0.6);
scene.add(ambientLight);

const sunLight = new THREE.DirectionalLight(0xffeedd, 1.4);
sunLight.position.set(30, 50, 20);
sunLight.castShadow = true;
sunLight.shadow.mapSize.width = 2048;
sunLight.shadow.mapSize.height = 2048;
sunLight.shadow.camera.near = 1;
sunLight.shadow.camera.far = 200;
sunLight.shadow.camera.left = -50;
sunLight.shadow.camera.right = 50;
sunLight.shadow.camera.top = 50;
sunLight.shadow.camera.bottom = -50;
scene.add(sunLight);

const hemiLight = new THREE.HemisphereLight(0x87ceeb, 0x3a7a33, 0.4);
scene.add(hemiLight);

// ── Ground ──
const groundGeo = new THREE.PlaneGeometry(400, ROAD_LENGTH + 200);
const groundMat = new THREE.MeshLambertMaterial({ color: 0x3a8a33 });
const ground = new THREE.Mesh(groundGeo, groundMat);
ground.rotation.x = -Math.PI / 2;
ground.position.set(0, -0.05, -ROAD_LENGTH / 2);
ground.receiveShadow = true;
scene.add(ground);

// ── Road ──
const roadGroup = new THREE.Group();
scene.add(roadGroup);

const roadSegments = [];
const roadMat1 = new THREE.MeshLambertMaterial({ color: 0x444444 });
const roadMat2 = new THREE.MeshLambertMaterial({ color: 0x3c3c3c });
const rumbleMat1 = new THREE.MeshLambertMaterial({ color: 0xdd2222 });
const rumbleMat2 = new THREE.MeshLambertMaterial({ color: 0xffffff });
const laneMat = new THREE.MeshLambertMaterial({ color: 0xffffff });

for (let i = 0; i < NUM_SEGMENTS; i++) {
  const segGroup = new THREE.Group();
  const isAlt = i % 2 === 0;

  // Road surface
  const roadGeo = new THREE.PlaneGeometry(ROAD_WIDTH, SEGMENT_LENGTH);
  const road = new THREE.Mesh(roadGeo, isAlt ? roadMat1 : roadMat2);
  road.rotation.x = -Math.PI / 2;
  road.position.y = 0.01;
  road.receiveShadow = true;
  segGroup.add(road);

  // Rumble strips
  const rumbleW = 0.5;
  const rumbleGeo = new THREE.PlaneGeometry(rumbleW, SEGMENT_LENGTH);
  const leftRumble = new THREE.Mesh(rumbleGeo, isAlt ? rumbleMat1 : rumbleMat2);
  leftRumble.rotation.x = -Math.PI / 2;
  leftRumble.position.set(-ROAD_WIDTH / 2 - rumbleW / 2, 0.015, 0);
  segGroup.add(leftRumble);

  const rightRumble = new THREE.Mesh(rumbleGeo, isAlt ? rumbleMat1 : rumbleMat2);
  rightRumble.rotation.x = -Math.PI / 2;
  rightRumble.position.set(ROAD_WIDTH / 2 + rumbleW / 2, 0.015, 0);
  segGroup.add(rightRumble);

  // Lane markings (only on alternating segments for dashed look)
  if (isAlt) {
    for (let l = 1; l < LANE_COUNT; l++) {
      const laneX = -ROAD_WIDTH / 2 + l * LANE_WIDTH;
      const laneGeo = new THREE.PlaneGeometry(0.12, SEGMENT_LENGTH * 0.5);
      const laneLine = new THREE.Mesh(laneGeo, laneMat);
      laneLine.rotation.x = -Math.PI / 2;
      laneLine.position.set(laneX, 0.02, 0);
      segGroup.add(laneLine);
    }
  }

  segGroup.position.z = -i * SEGMENT_LENGTH;
  roadGroup.add(segGroup);
  roadSegments.push(segGroup);
}

// ── Trees ──
const treeGroup = new THREE.Group();
scene.add(treeGroup);

function createTree() {
  const group = new THREE.Group();

  const trunkGeo = new THREE.CylinderGeometry(0.15, 0.2, 1.5, 6);
  const trunkMat = new THREE.MeshLambertMaterial({ color: 0x6b4423 });
  const trunk = new THREE.Mesh(trunkGeo, trunkMat);
  trunk.position.y = 0.75;
  trunk.castShadow = true;
  group.add(trunk);

  const foliageColors = [0x228b22, 0x2d8a2d, 0x1a6b1a, 0x3da63d];
  const layers = [
    { r: 1.6, h: 2.0, y: 2.5 },
    { r: 1.2, h: 1.8, y: 3.5 },
    { r: 0.8, h: 1.5, y: 4.3 }
  ];

  layers.forEach((l, idx) => {
    const coneGeo = new THREE.ConeGeometry(l.r, l.h, 7);
    const coneMat = new THREE.MeshLambertMaterial({
      color: foliageColors[idx % foliageColors.length]
    });
    const cone = new THREE.Mesh(coneGeo, coneMat);
    cone.position.y = l.y;
    cone.castShadow = true;
    group.add(cone);
  });

  return group;
}

const treesLeft = [];
const treesRight = [];

for (let i = 0; i < NUM_TREES_PER_SIDE; i++) {
  const treeL = createTree();
  const scaleL = 0.7 + Math.random() * 0.8;
  treeL.scale.set(scaleL, scaleL, scaleL);
  treeL.position.set(
    -ROAD_WIDTH / 2 - 2.5 - Math.random() * 6,
    0,
    -i * TREE_SPACING - Math.random() * 3
  );
  treeL.rotation.y = Math.random() * Math.PI * 2;
  treeGroup.add(treeL);
  treesLeft.push(treeL);

  const treeR = createTree();
  const scaleR = 0.7 + Math.random() * 0.8;
  treeR.scale.set(scaleR, scaleR, scaleR);
  treeR.position.set(
    ROAD_WIDTH / 2 + 2.5 + Math.random() * 6,
    0,
    -i * TREE_SPACING - Math.random() * 3
  );
  treeR.rotation.y = Math.random() * Math.PI * 2;
  treeGroup.add(treeR);
  treesRight.push(treeR);
}

// ── Car builder ──
function buildCar(color, isPlayer) {
  const group = new THREE.Group();

  // Body
  const bodyGeo = new THREE.BoxGeometry(1.6, 0.5, 3.2);
  const bodyMat = new THREE.MeshPhongMaterial({ color, shininess: 80, emissive: color, emissiveIntensity: 0.35 });
  const body = new THREE.Mesh(bodyGeo, bodyMat);
  body.position.y = 0.5;
  body.castShadow = true;
  group.add(body);

  // Cabin
  const cabinGeo = new THREE.BoxGeometry(1.3, 0.45, 1.6);
  const cabinColor = isPlayer ? 0x1a365d : 0x222233;
  const cabinMat = new THREE.MeshPhongMaterial({ color: cabinColor, shininess: 100 });
  const cabin = new THREE.Mesh(cabinGeo, cabinMat);
  cabin.position.set(0, 0.95, -0.1);
  cabin.castShadow = true;
  group.add(cabin);

  // Windshield
  const windshieldGeo = new THREE.PlaneGeometry(1.2, 0.4);
  const windshieldMat = new THREE.MeshPhongMaterial({
    color: isPlayer ? 0x90cdf4 : 0x4a5568,
    shininess: 120, transparent: true, opacity: 0.8
  });
  const windshield = new THREE.Mesh(windshieldGeo, windshieldMat);
  windshield.position.set(0, 0.95, -0.95);
  windshield.rotation.x = -0.15;
  group.add(windshield);

  // Rear window
  const rearGeo = new THREE.PlaneGeometry(1.15, 0.35);
  const rear = new THREE.Mesh(rearGeo, windshieldMat);
  rear.position.set(0, 0.93, 0.78);
  rear.rotation.x = 0.15;
  rear.rotation.y = Math.PI;
  group.add(rear);

  // Wheels
  const wheelGeo = new THREE.CylinderGeometry(0.28, 0.28, 0.2, 12);
  const wheelMat = new THREE.MeshPhongMaterial({ color: 0x222222 });
  const wheelPositions = [
    [-0.85, 0.28, -0.9], [0.85, 0.28, -0.9],
    [-0.85, 0.28, 0.9], [0.85, 0.28, 0.9]
  ];
  wheelPositions.forEach(([wx, wy, wz]) => {
    const wheel = new THREE.Mesh(wheelGeo, wheelMat);
    wheel.rotation.z = Math.PI / 2;
    wheel.position.set(wx, wy, wz);
    wheel.castShadow = true;
    group.add(wheel);
  });

  // Headlights
  if (isPlayer) {
    const hlGeo = new THREE.SphereGeometry(0.1, 8, 8);
    const hlMat = new THREE.MeshBasicMaterial({ color: 0xffd700 });
    const hl1 = new THREE.Mesh(hlGeo, hlMat);
    hl1.position.set(-0.55, 0.5, -1.6);
    group.add(hl1);
    const hl2 = new THREE.Mesh(hlGeo, hlMat);
    hl2.position.set(0.55, 0.5, -1.6);
    group.add(hl2);

    // Racing stripe
    const stripeGeo = new THREE.PlaneGeometry(0.2, 3.2);
    const stripeMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
    const stripe = new THREE.Mesh(stripeGeo, stripeMat);
    stripe.rotation.x = -Math.PI / 2;
    stripe.position.set(0, 0.76, 0);
    group.add(stripe);
  }

  // Taillights
  const tlGeo = new THREE.BoxGeometry(0.2, 0.1, 0.05);
  const tlMat = new THREE.MeshBasicMaterial({ color: 0xe53e3e });
  const tl1 = new THREE.Mesh(tlGeo, tlMat);
  tl1.position.set(-0.6, 0.5, 1.6);
  group.add(tl1);
  const tl2 = new THREE.Mesh(tlGeo, tlMat);
  tl2.position.set(0.6, 0.5, 1.6);
  group.add(tl2);

  return group;
}

// ── Player car ──
const playerCar = buildCar(0x00ccff, true);
playerCar.position.set(0, 0, 5);
scene.add(playerCar);

// ── Enemy management ──
function spawnEnemy() {
  const lane = Math.floor(Math.random() * LANE_COUNT);
  const laneX = -ROAD_WIDTH / 2 + LANE_WIDTH / 2 + lane * LANE_WIDTH;
  const colorIdx = Math.floor(Math.random() * ENEMY_COLORS.length);

  const car = buildCar(ENEMY_COLORS[colorIdx], false);
  car.position.set(laneX, 0, playerCar.position.z - 250 - Math.random() * 50);
  car.rotation.y = Math.PI; // face toward player

  const enemy = {
    mesh: car,
    speed: speed * (0.3 + Math.random() * 0.25),
    lane: laneX
  };

  scene.add(car);
  enemies.push(enemy);
}

function removeEnemy(idx) {
  scene.remove(enemies[idx].mesh);
  enemies[idx].mesh.traverse(child => {
    if (child.geometry) child.geometry.dispose();
    if (child.material) child.material.dispose();
  });
  enemies.splice(idx, 1);
}

// ── Crash particles ──
function spawnCrashParticles() {
  const colors = [0xe94560, 0xff6b35, 0xffd166, 0xffffff, 0x3182ce];
  for (let i = 0; i < 50; i++) {
    const geo = new THREE.BoxGeometry(0.15, 0.15, 0.15);
    const mat = new THREE.MeshBasicMaterial({ color: colors[Math.floor(Math.random() * colors.length)] });
    const mesh = new THREE.Mesh(geo, mat);
    mesh.position.copy(playerCar.position);
    mesh.position.y += 0.5;

    const particle = {
      mesh,
      vx: (Math.random() - 0.5) * 8,
      vy: 2 + Math.random() * 6,
      vz: (Math.random() - 0.5) * 8,
      life: 60 + Math.random() * 40
    };

    scene.add(mesh);
    crashParticles.push(particle);
  }
}

function updateParticles(dt) {
  for (let i = crashParticles.length - 1; i >= 0; i--) {
    const p = crashParticles[i];
    p.mesh.position.x += p.vx * dt;
    p.mesh.position.y += p.vy * dt;
    p.mesh.position.z += p.vz * dt;
    p.vy -= 12 * dt;
    p.mesh.rotation.x += 5 * dt;
    p.mesh.rotation.z += 3 * dt;
    p.life--;

    p.mesh.material.opacity = Math.max(0, p.life / 80);
    p.mesh.material.transparent = true;

    if (p.life <= 0 || p.mesh.position.y < -1) {
      scene.remove(p.mesh);
      p.mesh.geometry.dispose();
      p.mesh.material.dispose();
      crashParticles.splice(i, 1);
    }
  }
}

// ── Collision ──
function checkCollision() {
  const px = playerCar.position.x;
  const pz = playerCar.position.z;

  for (const e of enemies) {
    const dx = Math.abs(px - e.mesh.position.x);
    const dz = Math.abs(pz - e.mesh.position.z);
    if (dx < 1.4 && dz < 2.8) return true;
  }
  return false;
}

// ── Recycle road segments, trees, ground ──
function recycleWorld() {
  const playerZ = playerCar.position.z;

  roadSegments.forEach(seg => {
    if (seg.position.z > playerZ + SEGMENT_LENGTH * 2) {
      seg.position.z -= NUM_SEGMENTS * SEGMENT_LENGTH;
    }
  });

  const totalTreeSpan = NUM_TREES_PER_SIDE * TREE_SPACING;
  treesLeft.forEach(t => {
    if (t.position.z > playerZ + TREE_SPACING * 2) {
      t.position.z -= totalTreeSpan;
      t.position.x = -ROAD_WIDTH / 2 - 2.5 - Math.random() * 6;
    }
  });
  treesRight.forEach(t => {
    if (t.position.z > playerZ + TREE_SPACING * 2) {
      t.position.z -= totalTreeSpan;
      t.position.x = ROAD_WIDTH / 2 + 2.5 + Math.random() * 6;
    }
  });

  ground.position.z = playerZ - ROAD_LENGTH / 2;
}

// ── Game logic ──
function resetGame() {
  score = 0;
  scoreFrac = 0;
  speed = 0;
  frameCount = 0;
  worldZ = 0;
  playerX = 0;
  playerVx = 0;

  playerCar.position.set(0, 0, 5);
  playerCar.rotation.y = 0;
  playerCar.visible = true;

  // Clean enemies
  for (let i = enemies.length - 1; i >= 0; i--) removeEnemy(i);

  // Clean particles
  crashParticles.forEach(p => {
    scene.remove(p.mesh);
    p.mesh.geometry.dispose();
    p.mesh.material.dispose();
  });
  crashParticles = [];

  // Reset road
  roadSegments.forEach((seg, i) => {
    seg.position.z = -i * SEGMENT_LENGTH;
  });

  // Reset trees
  treesLeft.forEach((t, i) => {
    t.position.z = -i * TREE_SPACING - Math.random() * 3;
    t.position.x = -ROAD_WIDTH / 2 - 2.5 - Math.random() * 6;
  });
  treesRight.forEach((t, i) => {
    t.position.z = -i * TREE_SPACING - Math.random() * 3;
    t.position.x = ROAD_WIDTH / 2 + 2.5 + Math.random() * 6;
  });

  ground.position.z = -ROAD_LENGTH / 2;
  clock = new THREE.Clock();
}

function update() {
  const dt = Math.min(clock.getDelta(), 0.05);
  frameCount++;

  // Auto-accelerate
  const currentMax = Math.min(maxSpeed, 30 + frameCount * 0.02);
  speed += 15 * dt;
  if (speed > currentMax) speed = currentMax;

  // Off-road slowdown
  if (Math.abs(playerCar.position.x) > ROAD_WIDTH / 2 + 0.5) {
    speed -= 40 * dt;
    if (speed < 10) speed = 10;
  }

  // Steering — smooth and gradual
  const steerForce = 8;
  const steerFriction = Math.pow(0.12, dt); // frame-rate independent decay

  if (keys['ArrowLeft'] || keys['KeyA']) playerVx -= steerForce * dt;
  if (keys['ArrowRight'] || keys['KeyD']) playerVx += steerForce * dt;

  playerVx *= steerFriction;
  const maxVx = 8;
  if (Math.abs(playerVx) > maxVx) playerVx = maxVx * Math.sign(playerVx);

  playerCar.position.x += playerVx * dt;

  // Clamp to road edges (with some off-road leeway)
  const roadLimit = ROAD_WIDTH / 2 + 2;
  if (playerCar.position.x < -roadLimit) { playerCar.position.x = -roadLimit; playerVx = 0; }
  if (playerCar.position.x > roadLimit) { playerCar.position.x = roadLimit; playerVx = 0; }

  // Move forward
  playerCar.position.z -= speed * dt;

  // Slight visual tilt
  playerCar.rotation.y = -playerVx * 0.02;

  // Camera follow
  camera.position.x = playerCar.position.x * 0.6;
  camera.position.z = playerCar.position.z + 10;
  camera.position.y = 5;
  camera.lookAt(
    playerCar.position.x * 0.3,
    1.5,
    playerCar.position.z - 20
  );

  // Sun follows player
  sunLight.position.set(
    playerCar.position.x + 30,
    50,
    playerCar.position.z - 20
  );
  sunLight.target.position.set(playerCar.position.x, 0, playerCar.position.z - 20);
  sunLight.target.updateMatrixWorld();

  // Recycle world
  recycleWorld();

  // Spawn enemies
  const spawnRate = Math.max(15, 45 - Math.floor(frameCount / 200) * 2);
  if (frameCount % spawnRate === 0) spawnEnemy();

  // Update enemies
  enemies.forEach(e => {
    e.mesh.position.z += e.speed * dt * 0.15;
  });

  // Remove enemies that are behind (+ whoosh sound when passed)
  for (let i = enemies.length - 1; i >= 0; i--) {
    if (enemies[i].mesh.position.z > playerCar.position.z + 5 && !enemies[i].passed) {
      enemies[i].passed = true;
      playWhoosh();
    }
    if (enemies[i].mesh.position.z > playerCar.position.z + 30) {
      removeEnemy(i);
    }
  }

  // Collision
  if (checkCollision()) {
    spawnCrashParticles();
    gameOver();
    return;
  }

  // Score — accumulate fractional and flush to integer
  scoreFrac += speed * dt;
  if (scoreFrac >= 1) {
    const add = Math.floor(scoreFrac);
    score += add;
    scoreFrac -= add;
  }

  // Particles
  updateParticles(dt);

  // Engine sound
  updateEngineSound(speed, maxSpeed);

  // HUD
  scoreEl.textContent = `Score: ${score}`;
  speedEl.textContent = `Speed: ${Math.floor(speed * 3)} km/h`;
}

function gameOver() {
  gameState = 'dying';
  document.getElementById('mobileControls').classList.remove('visible');
  playerCar.visible = false;
  stopEngine();
  playCrash();

  if (score > highScore) {
    highScore = score;
    localStorage.setItem('racingHighScore', highScore.toString());
    highScoreEl.textContent = `Best: ${highScore}`;
  }

  setTimeout(() => {
    gameState = 'gameover';
    overlayTitle.textContent = 'Crash!';
    overlayMsg.textContent = score >= highScore ? 'New High Score!' : 'Try again!';
    finalScoreEl.textContent = `Score: ${score}`;
    finalScoreEl.classList.remove('hidden');
    startBtn.textContent = 'Race Again';
    overlayEl.classList.remove('hidden');
  }, 1200);
}

function startGame() {
  initAudio();
  resetGame();
  gameState = 'playing';
  overlayEl.classList.add('hidden');
  finalScoreEl.classList.add('hidden');
  startEngine();
  document.getElementById('mobileControls').classList.add('visible');
}

// ── Render loop ──
function animate() {
  requestAnimationFrame(animate);

  if (gameState === 'playing') {
    update();
  } else if (gameState === 'dying') {
    const dt = Math.min(clock.getDelta(), 0.05);
    updateParticles(dt);
    // Slowly pan camera up during death
    camera.position.y += 2 * dt;
  }

  renderer.render(scene, camera);
}

// ── Input ──
document.addEventListener('keydown', e => {
  keys[e.code] = true;
  if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space'].includes(e.code)) {
    e.preventDefault();
  }
  if (e.code === 'Space' && gameState !== 'playing') startGame();
});

document.addEventListener('keyup', e => { keys[e.code] = false; });
startBtn.addEventListener('click', startGame);

// ── Mobile touch controls ──
(function() {
  const leftBtn = document.getElementById('leftBtn');
  const rightBtn = document.getElementById('rightBtn');

  function setupMobileBtn(btn, keyCode) {
    btn.addEventListener('pointerdown', e => {
      e.preventDefault();
      keys[keyCode] = true;
      btn.setPointerCapture(e.pointerId);
    });
    btn.addEventListener('pointerup', () => { keys[keyCode] = false; });
    btn.addEventListener('pointercancel', () => { keys[keyCode] = false; });
    btn.addEventListener('pointerleave', () => { keys[keyCode] = false; });
  }

  setupMobileBtn(leftBtn, 'ArrowLeft');
  setupMobileBtn(rightBtn, 'ArrowRight');

  // Show touch hint on touch devices
  if ('ontouchstart' in window || navigator.maxTouchPoints > 0) {
    document.querySelector('.controls-hint').textContent = 'Tap and hold the arrows to steer';
  }
})();

// ── Handle resize ──
window.addEventListener('resize', () => {
  renderer.setSize(window.innerWidth, window.innerHeight);
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
});

// ── Init ──
resetGame();
animate();
</script>
</body>
</html>
