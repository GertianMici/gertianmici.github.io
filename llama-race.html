<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:;" />
<title>Llama Race - Betting</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #1a1a2e;
    font-family: 'Segoe UI', sans-serif;
    color: #fff;
    overflow: hidden;
    height: 100vh;
    display: flex;
    flex-direction: column;
  }

  #topBar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 20px;
    background: #16213e;
    border-bottom: 2px solid #d4a017;
    flex-shrink: 0;
    z-index: 10;
  }
  #topBar h1 { font-size: 24px; color: #d4a017; }
  #raceStatus { font-size: 18px; color: #ccc; }

  #main {
    display: flex;
    flex: 1;
    min-height: 0;
  }

  /* Left panel - betting */
  #bettingPanel {
    width: 340px;
    background: #16213e;
    border-right: 2px solid #333;
    display: flex;
    flex-direction: column;
    flex-shrink: 0;
  }
  #bettingPanel h2 {
    padding: 12px 16px;
    font-size: 16px;
    color: #d4a017;
    border-bottom: 1px solid #333;
  }

  #betForm {
    padding: 12px 16px;
    border-bottom: 1px solid #333;
  }
  #betForm label {
    display: block;
    font-size: 12px;
    color: #aaa;
    margin-bottom: 4px;
    margin-top: 10px;
  }
  #betForm label:first-child { margin-top: 0; }
  #betForm input[type="text"],
  #betForm input[type="number"] {
    width: 100%;
    background: #0f3460;
    border: 1px solid #444;
    color: #fff;
    border-radius: 6px;
    padding: 8px 10px;
    font-size: 14px;
    font-family: 'Segoe UI', sans-serif;
    outline: none;
  }
  #betForm input:focus { border-color: #d4a017; }
  #betForm input::placeholder { color: #556; }

  .llama-options {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 6px;
    margin-top: 4px;
  }
  .llama-option {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 7px 10px;
    background: #0f3460;
    border: 2px solid transparent;
    border-radius: 6px;
    cursor: pointer;
    font-size: 13px;
    color: #ccc;
    transition: all 0.15s;
    touch-action: manipulation;
  }
  .llama-option:hover { border-color: #555; background: #153a6e; }
  .llama-option.selected { border-color: #d4a017; background: #1a4a7a; color: #fff; }
  .llama-option .llama-dot {
    width: 12px; height: 12px;
    border-radius: 50%;
    flex-shrink: 0;
  }
  .llama-option .llama-num {
    font-weight: bold;
    font-size: 11px;
    color: #888;
  }

  #placeBetBtn {
    margin-top: 12px;
    padding: 10px 16px;
    background: #d4a017;
    color: #000;
    border: none;
    border-radius: 6px;
    font-weight: bold;
    cursor: pointer;
    font-size: 14px;
    width: 100%;
    transition: background 0.15s;
    touch-action: manipulation;
  }
  #placeBetBtn:hover { background: #e8b830; }
  #placeBetBtn:disabled { background: #555; color: #888; cursor: not-allowed; }
  .bet-error {
    color: #e94560;
    font-size: 12px;
    margin-top: 6px;
    min-height: 16px;
  }

  #betsList {
    flex: 1;
    overflow-y: auto;
    padding: 8px 16px;
  }
  .bet-entry {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 6px 10px;
    margin-bottom: 4px;
    background: #0f3460;
    border-radius: 4px;
    font-size: 13px;
  }
  .bet-entry .bet-name { font-weight: bold; }
  .bet-entry .bet-llama {
    display: inline-block;
    width: 10px; height: 10px;
    border-radius: 50%;
    margin-right: 4px;
    vertical-align: middle;
  }
  .bet-entry .bet-amount { color: #d4a017; }

  /* Results panel */
  #resultsPanel {
    display: none;
    padding: 12px 16px;
    border-top: 1px solid #333;
    background: #0a1628;
    max-height: 200px;
    overflow-y: auto;
  }
  #resultsPanel.show { display: block; }
  #resultsPanel h3 { color: #d4a017; margin-bottom: 8px; font-size: 15px; }
  .result-entry {
    padding: 5px 10px;
    margin-bottom: 3px;
    border-radius: 4px;
    font-size: 13px;
  }
  .result-win { background: #1a4a1a; color: #4ade80; }
  .result-lose { background: #3a1a1a; color: #f87171; }

  /* Canvas area */
  #raceArea {
    flex: 1;
    position: relative;
    min-width: 0;
  }
  #raceArea canvas {
    width: 100%;
    height: 100%;
    display: block;
  }

  /* Race controls */
  #raceControls {
    position: absolute;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 12px;
    z-index: 5;
  }
  .race-btn {
    padding: 12px 28px;
    font-size: 16px;
    font-weight: bold;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    transition: all 0.2s;
    touch-action: manipulation;
  }
  #startRaceBtn { background: #4ade80; color: #000; }
  #startRaceBtn:hover { background: #22c55e; }
  #startRaceBtn:disabled { background: #555; color: #888; cursor: not-allowed; }
  #resetBtn { background: #e94560; color: #fff; }
  #resetBtn:hover { background: #c73652; }

  /* Llama legend */
  #llamaLegend {
    position: absolute;
    top: 10px;
    right: 10px;
    background: rgba(0,0,0,0.7);
    padding: 10px 14px;
    border-radius: 8px;
    font-size: 13px;
    z-index: 5;
  }
  .legend-row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 4px;
  }
  .legend-color {
    width: 14px; height: 14px;
    border-radius: 3px;
    flex-shrink: 0;
  }

  /* Finish overlay */
  #finishOverlay {
    display: none;
    position: absolute;
    inset: 0;
    background: rgba(0,0,0,0.6);
    z-index: 15;
    justify-content: center;
    align-items: center;
    flex-direction: column;
  }
  #finishOverlay.show { display: flex; }
  #finishOverlay h2 { font-size: 42px; color: #d4a017; margin-bottom: 10px; }
  #finishOverlay .winner-name { font-size: 28px; margin-bottom: 20px; }

  /* ── Mobile Responsive ── */
  @media (max-width: 768px) {
    #main {
      flex-direction: column;
    }
    /* Race track on top, betting panel below */
    #raceArea {
      order: 1;
      flex: 1;
      min-height: 0;
    }
    #bettingPanel {
      order: 2;
      width: 100%;
      height: 45vh;
      max-height: 45vh;
      overflow-y: auto;
      border-right: none;
      border-top: 2px solid #333;
      flex-shrink: 0;
    }
    /* Flatten inner scroll contexts so outer panel scrolls */
    #betsList { overflow-y: visible; flex: 0 0 auto; }
    #resultsPanel { max-height: none; overflow-y: visible; }
    /* Compact top bar */
    #topBar h1 { font-size: 18px; }
    #raceStatus { font-size: 14px; }
    /* Hide legend — lane numbers on track are enough */
    #llamaLegend { display: none; }
    /* Race control buttons */
    .race-btn { padding: 10px 18px; font-size: 14px; }
    #raceControls { bottom: 8px; gap: 8px; }
    /* Finish overlay */
    #finishOverlay h2 { font-size: 28px; }
    #finishOverlay .winner-name { font-size: 20px; }
  }

  @media (max-width: 480px) {
    #topBar { padding: 6px 12px; }
    #topBar h1 { font-size: 15px; }
    #raceStatus { font-size: 12px; }
    #bettingPanel h2 { font-size: 14px; padding: 8px 12px; }
    #betForm { padding: 8px 12px; }
    #betForm label { margin-top: 8px; }
    .bet-entry { font-size: 12px; padding: 5px 8px; }
    .llama-option { font-size: 12px; padding: 5px 8px; }
    .race-btn { padding: 8px 14px; font-size: 13px; }
  }
</style>
</head>
<body>

<div id="topBar">
  <h1>Llama Derby</h1>
  <span id="raceStatus">Place your bets!</span>
</div>

<div id="main">
  <div id="bettingPanel">
    <h2>Place Bets</h2>
    <div id="betForm">
      <label>Bettor Name</label>
      <input type="text" id="betName" placeholder="e.g. Ben" autocomplete="off">

      <label>Bet Amount ($)</label>
      <input type="number" id="betAmount" placeholder="10" min="1" step="1">

      <label>Pick a Llama</label>
      <div class="llama-options" id="llamaOptions"></div>

      <div class="bet-error" id="betError"></div>
      <button id="placeBetBtn">Place Bet</button>
    </div>
    <h2>Current Bets</h2>
    <div id="betsList"></div>
    <div id="resultsPanel">
      <h3>Results</h3>
      <div id="resultsContent"></div>
    </div>
  </div>

  <div id="raceArea">
    <canvas id="raceCanvas"></canvas>
    <div id="llamaLegend"></div>
    <div id="raceControls">
      <button class="race-btn" id="startRaceBtn">Start Race</button>
      <button class="race-btn" id="resetBtn">New Race</button>
    </div>
    <div id="finishOverlay">
      <h2>Race Over!</h2>
      <div class="winner-name" id="winnerText"></div>
    </div>
  </div>
</div>

<script>
// ── Config ──
const LLAMA_COUNT = 6;
const LLAMAS = [
  { name: 'Lightning', color: '#e94560', bodyColor: '#c0392b' },
  { name: 'Thunder',   color: '#3498db', bodyColor: '#2874a6' },
  { name: 'Dusty',     color: '#f39c12', bodyColor: '#d4a017' },
  { name: 'Shadow',    color: '#8e44ad', bodyColor: '#6c3483' },
  { name: 'Speedy',    color: '#2ecc71', bodyColor: '#1e8449' },
  { name: 'Blaze',     color: '#e67e22', bodyColor: '#ca6f1e' }
];

// ── Canvas ──
const canvas = document.getElementById('raceCanvas');
const ctx = canvas.getContext('2d');

// ── DOM ──
const betNameInput = document.getElementById('betName');
const betAmountInput = document.getElementById('betAmount');
const llamaOptionsEl = document.getElementById('llamaOptions');
const betError = document.getElementById('betError');
const placeBetBtn = document.getElementById('placeBetBtn');
const betsList = document.getElementById('betsList');
const startRaceBtn = document.getElementById('startRaceBtn');
const resetBtn = document.getElementById('resetBtn');
const raceStatus = document.getElementById('raceStatus');
const resultsPanel = document.getElementById('resultsPanel');
const resultsContent = document.getElementById('resultsContent');
const finishOverlay = document.getElementById('finishOverlay');
const winnerText = document.getElementById('winnerText');
const llamaLegend = document.getElementById('llamaLegend');

// ── State ──
let gameState = 'betting'; // betting | racing | finished
let bets = [];
let llamaPositions = [];
let llamaSpeeds = [];
let llamaFinished = [];
let finishOrder = [];
let raceTime = 0;
let trackLength = 0;
let animFrame = null;

// Escape HTML entities to prevent XSS when inserting user-supplied text into innerHTML
function escapeHtml(str) {
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

// Cryptographic randomness for unpredictable results
function secureRandom() {
  const arr = new Uint32Array(1);
  crypto.getRandomValues(arr);
  return arr[0] / (0xFFFFFFFF + 1);
}

// ── Build legend ──
function buildLegend() {
  llamaLegend.innerHTML = LLAMAS.map((l, i) =>
    `<div class="legend-row">
      <div class="legend-color" style="background:${l.color}"></div>
      <span>#${i + 1} ${l.name}</span>
    </div>`
  ).join('');
}
buildLegend();

// ── Resize canvas ──
function resizeCanvas() {
  const area = document.getElementById('raceArea');
  canvas.width = area.clientWidth;
  canvas.height = area.clientHeight;
  trackLength = canvas.width - 180;
}
window.addEventListener('resize', resizeCanvas);
resizeCanvas();

// ── Betting UI ──
let selectedLlama = -1;

// Build llama selection buttons
function buildLlamaOptions() {
  llamaOptionsEl.innerHTML = LLAMAS.map((l, i) =>
    `<div class="llama-option" data-llama="${i}">
      <div class="llama-dot" style="background:${l.color}"></div>
      <span class="llama-num">#${i + 1}</span>
      <span>${l.name}</span>
    </div>`
  ).join('');

  llamaOptionsEl.querySelectorAll('.llama-option').forEach(el => {
    el.addEventListener('click', () => {
      llamaOptionsEl.querySelectorAll('.llama-option').forEach(o => o.classList.remove('selected'));
      el.classList.add('selected');
      selectedLlama = parseInt(el.dataset.llama);
      betError.textContent = '';
    });
  });
}
buildLlamaOptions();

placeBetBtn.addEventListener('click', () => {
  const name = betNameInput.value.trim();
  const amount = parseFloat(betAmountInput.value);

  if (!name) { betError.textContent = 'Enter a name'; return; }
  if (!amount || amount <= 0) { betError.textContent = 'Enter a valid amount'; return; }
  if (selectedLlama < 0) { betError.textContent = 'Pick a llama'; return; }

  bets.push({ name, llama: selectedLlama, amount });

  // Reset form
  betNameInput.value = '';
  betAmountInput.value = '';
  selectedLlama = -1;
  llamaOptionsEl.querySelectorAll('.llama-option').forEach(o => o.classList.remove('selected'));
  betError.textContent = '';

  renderBets();
  betNameInput.focus();
});

function renderBets() {
  betsList.innerHTML = bets.map((b, i) => {
    const l = LLAMAS[b.llama];
    return `<div class="bet-entry">
      <span>
        <span class="bet-name">${escapeHtml(b.name)}</span> on
        <span class="bet-llama" style="background:${l.color}"></span>${l.name}
      </span>
      <span class="bet-amount">$${b.amount.toFixed(2)}</span>
    </div>`;
  }).join('');
}

// ── Race init ──
function initRace() {
  llamaPositions = new Array(LLAMA_COUNT).fill(0);
  llamaSpeeds = new Array(LLAMA_COUNT).fill(0);
  llamaFinished = new Array(LLAMA_COUNT).fill(false);
  finishOrder = [];
  raceTime = 0;

  // Each llama gets random base speed + variance factor (all pre-seeded with crypto random)
  for (let i = 0; i < LLAMA_COUNT; i++) {
    llamaSpeeds[i] = {
      base: 0.8 + secureRandom() * 0.6,
      variance: 0.3 + secureRandom() * 0.5,
      phase: secureRandom() * Math.PI * 2,
      freq: 0.5 + secureRandom() * 1.5,
      burstChance: 0.002 + secureRandom() * 0.004,
      stumbleChance: 0.001 + secureRandom() * 0.003
    };
  }
}

// ── Drawing ──
function drawTrack() {
  const w = canvas.width;
  const h = canvas.height;

  // Sky
  const skyGrad = ctx.createLinearGradient(0, 0, 0, h * 0.35);
  skyGrad.addColorStop(0, '#87ceeb');
  skyGrad.addColorStop(1, '#b0e0e6');
  ctx.fillStyle = skyGrad;
  ctx.fillRect(0, 0, w, h * 0.35);

  // Distant hills
  ctx.fillStyle = '#5a8a4a';
  ctx.beginPath();
  ctx.moveTo(0, h * 0.35);
  for (let x = 0; x <= w; x += 30) {
    ctx.lineTo(x, h * 0.35 - Math.sin(x * 0.008) * 20 - Math.sin(x * 0.015) * 12);
  }
  ctx.lineTo(w, h * 0.35);
  ctx.fill();

  // Ground
  ctx.fillStyle = '#4a8c3f';
  ctx.fillRect(0, h * 0.35, w, h * 0.65);

  // Track area
  const trackTop = h * 0.38;
  const laneHeight = (h * 0.55) / LLAMA_COUNT;
  const trackBottom = trackTop + laneHeight * LLAMA_COUNT;

  // Dirt track background
  ctx.fillStyle = '#c4a265';
  ctx.fillRect(0, trackTop - 10, w, trackBottom - trackTop + 20);

  // Track border top
  ctx.fillStyle = '#fff';
  ctx.fillRect(0, trackTop - 12, w, 4);
  // Track border bottom
  ctx.fillRect(0, trackBottom + 8, w, 4);

  // Lane separators + lane backgrounds
  for (let i = 0; i < LLAMA_COUNT; i++) {
    const y = trackTop + i * laneHeight;

    // Alternating lane shade
    ctx.fillStyle = i % 2 === 0 ? '#b8984a' : '#c4a265';
    ctx.fillRect(0, y, w, laneHeight);

    // Lane number
    ctx.fillStyle = 'rgba(0,0,0,0.3)';
    ctx.font = 'bold 16px Segoe UI';
    ctx.textAlign = 'center';
    ctx.fillText(`${i + 1}`, 20, y + laneHeight / 2 + 5);

    // Lane separator line
    if (i > 0) {
      ctx.strokeStyle = 'rgba(255,255,255,0.25)';
      ctx.lineWidth = 1;
      ctx.setLineDash([8, 6]);
      ctx.beginPath();
      ctx.moveTo(40, y);
      ctx.lineTo(w - 10, y);
      ctx.stroke();
      ctx.setLineDash([]);
    }
  }

  // Start line
  const startX = 70;
  for (let i = 0; i < Math.ceil((trackBottom - trackTop + 20) / 8); i++) {
    ctx.fillStyle = i % 2 === 0 ? '#fff' : '#000';
    ctx.fillRect(startX, trackTop - 10 + i * 8, 6, 8);
  }

  // Starting gates / stalls
  const gateX = startX - 40;
  const gateW = 38;
  for (let i = 0; i < LLAMA_COUNT; i++) {
    const gy = trackTop + i * laneHeight;
    const gh = laneHeight;

    // Gate frame (metal look)
    ctx.strokeStyle = '#888';
    ctx.lineWidth = 2.5;
    ctx.strokeRect(gateX, gy + 1, gateW, gh - 2);

    // Vertical bars
    ctx.strokeStyle = '#aaa';
    ctx.lineWidth = 1.5;
    const barSpacing = 6;
    for (let bx = gateX + barSpacing; bx < gateX + gateW; bx += barSpacing) {
      ctx.beginPath();
      ctx.moveTo(bx, gy + 1);
      ctx.lineTo(bx, gy + gh - 2);
      ctx.stroke();
    }

    // Top rail (thicker)
    ctx.fillStyle = '#777';
    ctx.fillRect(gateX - 1, gy, gateW + 2, 3);

    // Gate number
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 10px Segoe UI';
    ctx.textAlign = 'center';
    ctx.fillText(`${i + 1}`, gateX + gateW / 2, gy - 3);
  }

  // Gate top bar (horizontal beam across all stalls)
  ctx.fillStyle = '#666';
  ctx.fillRect(gateX - 3, trackTop - 14, gateW + 6, 5);
  ctx.fillRect(gateX - 3, trackBottom + 6, gateW + 6, 5);

  // "START" text above gates
  ctx.fillStyle = '#d4a017';
  ctx.font = 'bold 14px Segoe UI';
  ctx.textAlign = 'center';
  ctx.fillText('START', gateX + gateW / 2, trackTop - 18);

  // Finish line
  const finishX = startX + trackLength;
  for (let i = 0; i < Math.ceil((trackBottom - trackTop + 20) / 8); i++) {
    ctx.fillStyle = i % 2 === 0 ? '#fff' : '#000';
    ctx.fillRect(finishX, trackTop - 10 + i * 8, 8, 8);
    ctx.fillStyle = i % 2 === 0 ? '#000' : '#fff';
    ctx.fillRect(finishX + 8, trackTop - 10 + i * 8, 8, 8);
  }

  // "FINISH" text
  ctx.save();
  ctx.fillStyle = '#d4a017';
  ctx.font = 'bold 14px Segoe UI';
  ctx.textAlign = 'center';
  ctx.fillText('FINISH', finishX + 8, trackTop - 18);
  ctx.restore();

  // Fence posts along top and bottom
  ctx.strokeStyle = '#8B7355';
  ctx.lineWidth = 2;
  for (let x = 0; x < w; x += 40) {
    // Top fence
    ctx.fillStyle = '#f5f5dc';
    ctx.fillRect(x, trackTop - 24, 3, 16);
    // Bottom fence
    ctx.fillRect(x, trackBottom + 10, 3, 16);
  }
  // Horizontal fence rails
  ctx.strokeStyle = '#f5f5dc';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(0, trackTop - 18); ctx.lineTo(w, trackTop - 18);
  ctx.moveTo(0, trackTop - 12); ctx.lineTo(w, trackTop - 12);
  ctx.moveTo(0, trackBottom + 16); ctx.lineTo(w, trackBottom + 16);
  ctx.moveTo(0, trackBottom + 22); ctx.lineTo(w, trackBottom + 22);
  ctx.stroke();

  return { trackTop, laneHeight, startX };
}

function drawLlama(x, y, laneH, color, bodyColor, time, speedFactor, laneIdx) {
  const scale = Math.min(laneH / 55, 1.2);
  const cx = x;
  const cy = y + laneH / 2;

  ctx.save();
  ctx.translate(cx, cy);
  ctx.scale(scale, scale);

  // Body bob
  const bob = Math.sin(time * 8 * speedFactor) * 2 * speedFactor;
  ctx.translate(0, bob);

  // Shadow
  ctx.fillStyle = 'rgba(0,0,0,0.2)';
  ctx.beginPath();
  ctx.ellipse(0, 18 - bob, 22, 5, 0, 0, Math.PI * 2);
  ctx.fill();

  // Legs (4 legs with gallop animation)
  const legColor = bodyColor;
  const legW = 4;
  const legH = 16;
  const legAngle1 = Math.sin(time * 10 * speedFactor) * 0.5 * speedFactor;
  const legAngle2 = Math.sin(time * 10 * speedFactor + Math.PI) * 0.5 * speedFactor;

  // Back legs (left side, behind)
  ctx.save();
  ctx.fillStyle = legColor;
  ctx.translate(-12, 8);
  ctx.rotate(-legAngle2);
  ctx.fillRect(-legW / 2, 0, legW, legH);
  ctx.fillStyle = '#333';
  ctx.fillRect(-legW / 2, legH - 3, legW + 1, 3); // hoof
  ctx.restore();

  ctx.save();
  ctx.fillStyle = legColor;
  ctx.translate(-8, 8);
  ctx.rotate(-legAngle1);
  ctx.fillRect(-legW / 2, 0, legW, legH);
  ctx.fillStyle = '#333';
  ctx.fillRect(-legW / 2, legH - 3, legW + 1, 3);
  ctx.restore();

  // Front legs (right side, forward)
  ctx.save();
  ctx.fillStyle = legColor;
  ctx.translate(10, 6);
  ctx.rotate(-legAngle1);
  ctx.fillRect(-legW / 2, 0, legW, legH);
  ctx.fillStyle = '#333';
  ctx.fillRect(-legW / 2, legH - 3, legW + 1, 3);
  ctx.restore();

  ctx.save();
  ctx.fillStyle = legColor;
  ctx.translate(6, 6);
  ctx.rotate(-legAngle2);
  ctx.fillRect(-legW / 2, 0, legW, legH);
  ctx.fillStyle = '#333';
  ctx.fillRect(-legW / 2, legH - 3, legW + 1, 3);
  ctx.restore();

  // Body
  ctx.fillStyle = bodyColor;
  ctx.beginPath();
  ctx.ellipse(0, 0, 22, 12, 0, 0, Math.PI * 2);
  ctx.fill();

  // Body highlight
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.ellipse(0, -3, 18, 7, 0, Math.PI, Math.PI * 2);
  ctx.fill();

  // Neck (right side, facing forward)
  ctx.fillStyle = bodyColor;
  ctx.save();
  ctx.translate(16, -8);
  ctx.rotate(0.6);
  ctx.fillRect(-6, -20, 10, 22);
  ctx.restore();

  // Head (right side, facing forward)
  ctx.fillStyle = bodyColor;
  ctx.save();
  ctx.translate(24, -26);
  ctx.beginPath();
  ctx.ellipse(0, 0, 8, 6, 0.3, 0, Math.PI * 2);
  ctx.fill();

  // Snout
  ctx.fillStyle = '#d4a582';
  ctx.beginPath();
  ctx.ellipse(6, 2, 4, 3, 0.2, 0, Math.PI * 2);
  ctx.fill();

  // Eye
  ctx.fillStyle = '#111';
  ctx.beginPath();
  ctx.arc(2, -3, 2, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#fff';
  ctx.beginPath();
  ctx.arc(1.5, -3.5, 0.8, 0, Math.PI * 2);
  ctx.fill();

  // Ears
  ctx.fillStyle = bodyColor;
  ctx.beginPath();
  ctx.ellipse(2, -10, 3, 6, 0.3, 0, Math.PI * 2);
  ctx.fill();
  ctx.beginPath();
  ctx.ellipse(-4, -9, 3, 6, -0.2, 0, Math.PI * 2);
  ctx.fill();

  // Inner ears
  ctx.fillStyle = '#e8b4b4';
  ctx.beginPath();
  ctx.ellipse(2, -9, 1.5, 3.5, 0.3, 0, Math.PI * 2);
  ctx.fill();
  ctx.beginPath();
  ctx.ellipse(-4, -8, 1.5, 3.5, -0.2, 0, Math.PI * 2);
  ctx.fill();

  ctx.restore();

  // Tail (fluffy, now on left/back side)
  ctx.fillStyle = bodyColor;
  const tailWag = Math.sin(time * 6) * 0.3;
  ctx.save();
  ctx.translate(-20, -4);
  ctx.rotate(-0.5 + tailWag);
  ctx.beginPath();
  ctx.ellipse(-6, 0, 5, 4, -0.3, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();

  // Saddle blanket
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.ellipse(0, -6, 10, 5, 0, 0, Math.PI * 2);
  ctx.fill();

  // Number on saddle
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 10px Segoe UI';
  ctx.textAlign = 'center';
  ctx.fillText(`${laneIdx + 1}`, 0, -3);

  ctx.restore();
}

function drawPositionMarkers(trackInfo) {
  if (finishOrder.length === 0) return;

  ctx.save();
  ctx.font = 'bold 16px Segoe UI';
  ctx.textAlign = 'right';

  const positions = ['1st', '2nd', '3rd', '4th', '5th', '6th'];
  const posColors = ['#ffd700', '#c0c0c0', '#cd7f32', '#aaa', '#888', '#666'];

  finishOrder.forEach((llamaIdx, pos) => {
    const y = trackInfo.trackTop + llamaIdx * trackInfo.laneHeight + trackInfo.laneHeight / 2;
    ctx.fillStyle = posColors[pos] || '#666';
    ctx.fillText(positions[pos], canvas.width - 15, y + 5);
  });

  ctx.restore();
}

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  const trackInfo = drawTrack();

  // Draw llamas
  for (let i = 0; i < LLAMA_COUNT; i++) {
    const progress = llamaPositions[i];
    const x = trackInfo.startX + progress * trackLength;
    const y = trackInfo.trackTop + i * trackInfo.laneHeight;

    const speedFactor = gameState === 'racing' && !llamaFinished[i] ? 1 : (gameState === 'finished' ? 0.1 : 0);
    drawLlama(x, y, trackInfo.laneHeight, LLAMAS[i].color, LLAMAS[i].bodyColor, raceTime, speedFactor, i);
  }

  drawPositionMarkers(trackInfo);

  // Crowd in the stands (top)
  if (gameState === 'racing') {
    drawCrowd(trackInfo.trackTop - 30);
  }
}

function drawCrowd(baseY) {
  const w = canvas.width;
  // Simple animated crowd dots
  for (let x = 50; x < w - 50; x += 12) {
    const bounce = Math.sin(raceTime * 4 + x * 0.1) * 2;
    const colors = ['#e94560', '#3498db', '#f39c12', '#2ecc71', '#e67e22', '#8e44ad', '#fff', '#ffd700'];
    ctx.fillStyle = colors[Math.floor((x * 7 + raceTime * 100) % colors.length)];
    ctx.beginPath();
    ctx.arc(x, baseY - 45 + bounce, 3, 0, Math.PI * 2);
    ctx.fill();
  }
}

// ── Race update ──
function updateRace(dt) {
  raceTime += dt;

  for (let i = 0; i < LLAMA_COUNT; i++) {
    if (llamaFinished[i]) continue;

    const s = llamaSpeeds[i];

    // Base movement with sine wave variance (unpredictable due to crypto-random params)
    let moveSpeed = s.base + Math.sin(raceTime * s.freq + s.phase) * s.variance;

    // Random burst (sprint)
    if (secureRandom() < s.burstChance) {
      moveSpeed += 1.5 + secureRandom() * 2;
    }

    // Random stumble (slowdown)
    if (secureRandom() < s.stumbleChance) {
      moveSpeed *= 0.2;
    }

    // Additional micro-randomness every frame
    moveSpeed += (secureRandom() - 0.5) * 0.4;

    // Clamp to positive
    if (moveSpeed < 0.05) moveSpeed = 0.05;

    // Progress (0 to 1)
    llamaPositions[i] += moveSpeed * dt * 0.08;

    // Finish check
    if (llamaPositions[i] >= 1) {
      llamaPositions[i] = 1;
      llamaFinished[i] = true;
      finishOrder.push(i);
    }
  }

  // All finished?
  if (finishOrder.length === LLAMA_COUNT) {
    endRace();
  }
}

// ── Race lifecycle ──
function startRace() {
  if (gameState === 'racing') return;

  initRace();
  gameState = 'racing';
  raceStatus.textContent = 'Race in progress!';
  startRaceBtn.disabled = true;
  placeBetBtn.disabled = true;
  finishOverlay.classList.remove('show');
  resultsPanel.classList.remove('show');

  let lastTime = performance.now();

  function loop(now) {
    const dt = Math.min((now - lastTime) / 1000, 0.05);
    lastTime = now;

    updateRace(dt);
    draw();

    // Update status with leader
    if (gameState === 'racing') {
      let leader = 0;
      for (let i = 1; i < LLAMA_COUNT; i++) {
        if (llamaPositions[i] > llamaPositions[leader]) leader = i;
      }
      raceStatus.textContent = `Racing... ${LLAMAS[leader].name} leads!`;

      if (finishOrder.length > 0 && finishOrder.length < LLAMA_COUNT) {
        raceStatus.textContent = `${LLAMAS[finishOrder[0]].name} finished 1st! ${LLAMA_COUNT - finishOrder.length} still running...`;
      }

      animFrame = requestAnimationFrame(loop);
    }
  }

  animFrame = requestAnimationFrame(loop);
}

function endRace() {
  gameState = 'finished';
  startRaceBtn.disabled = false;
  placeBetBtn.disabled = false;

  const winner = finishOrder[0];
  const winnerLlama = LLAMAS[winner];

  raceStatus.textContent = `${winnerLlama.name} wins!`;
  winnerText.innerHTML = `<span style="color:${winnerLlama.color}">#${winner + 1} ${winnerLlama.name}</span> wins!`;
  finishOverlay.classList.add('show');

  // Calculate results
  calculateResults(winner);

  // Auto-hide finish overlay after 3s
  setTimeout(() => {
    finishOverlay.classList.remove('show');
  }, 3000);

  // One final draw
  draw();
}

function calculateResults(winnerIdx) {
  if (bets.length === 0) return;

  // Total pool
  const totalPool = bets.reduce((sum, b) => sum + b.amount, 0);

  // Total bet on winner
  const winnerPool = bets.filter(b => b.llama === winnerIdx).reduce((sum, b) => sum + b.amount, 0);

  // Odds = totalPool / winnerPool (pari-mutuel style)
  const odds = winnerPool > 0 ? totalPool / winnerPool : 0;

  let html = `<div style="margin-bottom:8px;color:#d4a017;">
    Winner: #${winnerIdx + 1} ${LLAMAS[winnerIdx].name} | Pool: $${totalPool.toFixed(2)} | Odds: ${odds > 0 ? odds.toFixed(2) + 'x' : 'N/A'}
  </div>`;

  // Finish order
  html += `<div style="margin-bottom:8px;color:#aaa;font-size:12px;">
    Finish: ${finishOrder.map((idx, pos) => `${pos + 1}. ${LLAMAS[idx].name}`).join(', ')}
  </div>`;

  bets.forEach(b => {
    const isWin = b.llama === winnerIdx;
    const payout = isWin ? b.amount * odds : 0;
    const profit = isWin ? payout - b.amount : -b.amount;
    const profitStr = profit >= 0 ? `+$${profit.toFixed(2)}` : `-$${Math.abs(profit).toFixed(2)}`;

    html += `<div class="result-entry ${isWin ? 'result-win' : 'result-lose'}">
      <strong>${escapeHtml(b.name)}</strong> bet $${b.amount.toFixed(2)} on ${LLAMAS[b.llama].name}
      ${isWin ? `— WON $${payout.toFixed(2)} (${profitStr})` : `— LOST (${profitStr})`}
    </div>`;
  });

  resultsContent.innerHTML = html;
  resultsPanel.classList.add('show');
}

function resetAll() {
  if (animFrame) cancelAnimationFrame(animFrame);
  gameState = 'betting';
  bets = [];
  finishOrder = [];
  llamaPositions = new Array(LLAMA_COUNT).fill(0);
  llamaFinished = new Array(LLAMA_COUNT).fill(false);
  raceTime = 0;

  renderBets();
  raceStatus.textContent = 'Place your bets!';
  startRaceBtn.disabled = false;
  placeBetBtn.disabled = false;
  finishOverlay.classList.remove('show');
  resultsPanel.classList.remove('show');

  draw();
}

// ── Events ──
startRaceBtn.addEventListener('click', startRace);
resetBtn.addEventListener('click', resetAll);

// Allow Enter key in form fields to place bet
betAmountInput.addEventListener('keydown', e => {
  if (e.key === 'Enter') { e.preventDefault(); placeBetBtn.click(); }
});
betNameInput.addEventListener('keydown', e => {
  if (e.key === 'Enter') { e.preventDefault(); betAmountInput.focus(); }
});

// ── Audio ──
let audioCtx = null;

function initAudio() {
  if (audioCtx) return;
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
}

function playStartBell() {
  initAudio();
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = 'sine';
  osc.frequency.value = 880;
  gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.8);
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.start();
  osc.stop(audioCtx.currentTime + 0.8);

  // Second bell hit
  setTimeout(() => {
    const osc2 = audioCtx.createOscillator();
    const gain2 = audioCtx.createGain();
    osc2.type = 'sine';
    osc2.frequency.value = 1100;
    gain2.gain.setValueAtTime(0.15, audioCtx.currentTime);
    gain2.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.6);
    osc2.connect(gain2);
    gain2.connect(audioCtx.destination);
    osc2.start();
    osc2.stop(audioCtx.currentTime + 0.6);
  }, 200);
}

function playFinishFanfare() {
  initAudio();
  const notes = [523, 659, 784, 1047];
  notes.forEach((freq, i) => {
    setTimeout(() => {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'triangle';
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.5);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.5);
    }, i * 150);
  });
}

// Hook audio into race events
const origStart = startRace;
startRaceBtn.removeEventListener('click', origStart);
startRaceBtn.addEventListener('click', () => {
  playStartBell();
  startRace();
});

const origEnd = endRace;
const _endRace = endRace;
// Monkey-patch endRace to add fanfare
const originalEndRace = endRace;
endRace = function() {
  originalEndRace();
  playFinishFanfare();
};

// ── Initial draw ──
llamaPositions = new Array(LLAMA_COUNT).fill(0);
llamaFinished = new Array(LLAMA_COUNT).fill(false);
draw();
</script>
