  <script>
    // Set the theme before first paint so the page never flashes the wrong one:
    // the visitor's saved choice if there is one, otherwise their system setting.
    (function () {
      var theme;
      try { theme = localStorage.getItem("theme"); } catch (e) {}
      if (theme !== "light" && theme !== "dark") {
        theme = window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
      }
      document.documentElement.setAttribute("data-theme", theme);
      document.querySelector('meta[name="theme-color"]').setAttribute("content", theme === "light" ? "#fbfbfc" : "#09090b");
    })();
  </script>
